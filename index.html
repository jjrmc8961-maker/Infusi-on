<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Monitor de Goteo IV Inteligente</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111827">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 1. Barra superior de prescripción */
    .prescription-bar {
      background: #111827;
      padding: 8px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      border-bottom: 1px solid #1f2937;
      z-index: 10;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .input-group label {
      font-size: 0.65rem;
      color: #9ca3af;
      text-transform: uppercase;
      font-weight: 600;
    }

    .input-group input, .input-group select {
      background: #1f2937;
      color: #fff;
      border: 1px solid #374151;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      width: 100%;
    }

    /* 2. Contenedor de video y mira */
    .camera-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .roi-box {
      position: absolute;
      width: 90px;
      height: 28px;
      border: 2px dashed #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      border-radius: 6px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.1s;
    }

    .roi-crosshair {
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
    }

    /* Estados del semáforo para la mira */
    .roi-box.status-target {
      border-color: #10b981;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.7);
      color: #10b981;
    }

    .roi-box.status-low {
      border-color: #f59e0b;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
      color: #f59e0b;
    }

    .roi-box.status-high {
      border-color: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
      color: #ef4444;
    }

    .roi-box.drop-pulse {
      background-color: rgba(255, 255, 255, 0.25);
    }

    /* Indicador textual sobre la cámara */
    .status-badge {
      position: absolute;
      top: 12px;
      background: rgba(17, 24, 39, 0.85);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      backdrop-filter: blur(4px);
      border: 1px solid #374151;
      text-transform: uppercase;
    }

    /* 3. Panel de métricas */
    .dashboard {
      background: #111827;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid #1f2937;
    }

    .metric-card {
      background: #1f2937;
      padding: 8px 10px;
      border-radius: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .metric-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #00f0ff;
      line-height: 1.1;
      transition: color 0.2s ease;
    }

    .metric-label {
      font-size: 0.65rem;
      color: #9ca3af;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .metric-target {
      font-size: 0.75rem;
      color: #d1d5db;
      font-weight: 600;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid #374151;
    }

    /* Colores del semáforo */
    .text-target { color: #10b981 !important; }
    .text-low { color: #f59e0b !important; }
    .text-high { color: #ef4444 !important; }

    /* 4. Controles inferiores */
    .controls {
      background: #0f172a;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    button {
      background: #374151;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    button.active {
      background: #0284c7;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: #9ca3af;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #00f0ff;
    }

    /* 5. Leyenda de descargo y créditos */
    .disclaimer-bar {
      background: #030712;
      padding: 6px 12px 8px;
      text-align: center;
      font-size: 0.6rem;
      line-height: 1.25;
      color: #6b7280;
      border-top: 1px solid #111827;
    }

    canvas#procCanvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="prescription-bar">
    <div class="input-group">
      <label>Volumen (ml)</label>
      <input type="number" id="inputVol" value="500" min="1" step="50">
    </div>
    <div class="input-group">
      <label>Tiempo (hrs)</label>
      <input type="number" id="inputTime" value="8" min="0.1" step="0.5">
    </div>
    <div class="input-group">
      <label>Equipo</label>
      <select id="dropFactor">
        <option value="20" selected>Normo (20)</option>
        <option value="60">Micro (60)</option>
        <option value="15">Macro (15)</option>
        <option value="10">Sangre (10)</option>
      </select>
    </div>
  </div>

  <div class="camera-container">
    <video id="videoElement" autoplay playsinline muted></video>
    
    <div class="status-badge" id="statusBadge">Esperando flujo...</div>

    <div class="roi-box" id="roiBox">
      <div class="roi-crosshair"></div>
    </div>
  </div>

  <div class="dashboard">
    <div class="metric-card">
      <div class="metric-value" id="bpmDisplay">0</div>
      <div class="metric-label">Gotas / min</div>
      <div class="metric-target" id="targetBpmDisplay">Meta: 21 gtt/m</div>
    </div>
    <div class="metric-card">
      <div class="metric-value" id="flowDisplay">0</div>
      <div class="metric-label">Velocidad Actual</div>
      <div class="metric-target" id="targetFlowDisplay">Meta: 63 ml/h</div>
    </div>
  </div>

  <div class="controls">
    <div class="control-group">
      <div class="slider-container" style="flex: 1;">
        <span>Sensibilidad:</span>
        <input type="range" id="sensitivity" min="5" max="50" value="18">
      </div>
      <button id="torchBtn" type="button">🔦 Flash</button>
    </div>
  </div>

  <!-- Pie con aviso clínico y créditos MUVIEL -->
  <footer class="disclaimer-bar">
    ⚠️ <strong>Aviso:</strong> Herramienta orientativa. No reemplaza el juicio clínico ni la supervisión manual del personal de enfermería. Verifique siempre antes de administrar.
    <div style="color: #00f0ff; margin-top: 4px; font-weight: bold; font-size: 0.65rem;">
      Diseño y elaboración por MUVIEL
    </div>
  </footer>

  <canvas id="procCanvas"></canvas>

  <script>
    // Limpieza de cualquier Service Worker rebelde previo
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(registration => registration.unregister());
      });
    }

    const video = document.getElementById('videoElement');
    let canvas = document.getElementById('procCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'procCanvas';
      canvas.style.display = 'none';
      document.body.appendChild(canvas);
    }
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const roiBox = document.getElementById('roiBox');
    const statusBadge = document.getElementById('statusBadge');
    const bpmDisplay = document.getElementById('bpmDisplay');
    const flowDisplay = document.getElementById('flowDisplay');
    const targetBpmDisplay = document.getElementById('targetBpmDisplay');
    const targetFlowDisplay = document.getElementById('targetFlowDisplay');

    const inputVol = document.getElementById('inputVol');
    const inputTime = document.getElementById('inputTime');
    const dropFactorSelect = document.getElementById('dropFactor');
    const sensitivitySlider = document.getElementById('sensitivity');
    const torchBtn = document.getElementById('torchBtn');

    let track = null;
    let torchState = false;
    let lastDropTime = 0;
    const intervals = [];
    const MAX_HISTORY = 4;

    let targetGttMin = 0;
    let targetMlHora = 0;

    const ROI_W = 50;
    const ROI_H = 6;
    canvas.width = ROI_W;
    canvas.height = ROI_H;

    let prevScanline = new Float32Array(ROI_W);

    function recalculateTargets() {
      const vol = parseFloat(inputVol.value) || 0;
      const hours = parseFloat(inputTime.value) || 0;
      const factor = parseFloat(dropFactorSelect.value) || 20;

      if (vol > 0 && hours > 0) {
        targetMlHora = Math.round(vol / hours);
        targetGttMin = Math.round((vol * factor) / (hours * 60));
        
        targetBpmDisplay.innerText = `Meta: ${targetGttMin} gtt/m`;
        targetFlowDisplay.innerText = `Meta: ${targetMlHora} ml/h`;
      } else {
        targetBpmDisplay.innerText = "Meta: --";
        targetFlowDisplay.innerText = "Meta: --";
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        track = stream.getVideoTracks()[0];

        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (!capabilities.torch) {
          torchBtn.style.display = 'none';
        }

        video.setAttribute('autoplay', '');
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');

        await video.play();
        requestAnimationFrame(processFrame);
      } catch (err) {
        alert("Error de cámara: " + err.message);
      }
    }

    torchBtn.addEventListener('click', async () => {
      if (!track) return;
      try {
        torchState = !torchState;
        await track.applyConstraints({ advanced: [{ torch: torchState }] });
        torchBtn.classList.toggle('active', torchState);
      } catch (e) {
        console.warn("Flash no disponible", e);
      }
    });

    function processFrame() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;

        const sampleW = Math.round(vw * 0.12);
        const sampleH = 10;
        const startX = Math.round((vw - sampleW) / 2);
        const startY = Math.round((vh - sampleH) / 2);

        ctx.drawImage(video, startX, startY, sampleW, sampleH, 0, 0, ROI_W, ROI_H);
        const frame = ctx.getImageData(0, 0, ROI_W, ROI_H);
        detectDropScanline(frame);
      }

      requestAnimationFrame(processFrame);
    }

    function detectDropScanline(frame) {
      const data = frame.data;
      const currentProfile = new Float32Array(ROI_W);

      for (let x = 0; x < ROI_W; x++) {
        let colSum = 0;
        for (let y = 0; y < ROI_H; y++) {
          const idx = (y * ROI_W + x) * 4;
          colSum += (data[idx] * 0.299 + data[idx + 1] * 0.587 + data[idx + 2] * 0.114);
        }
        currentProfile[x] = colSum / ROI_H;
      }

      let centerDiffMax = 0;
      const midStart = Math.floor(ROI_W * 0.25);
      const midEnd = Math.floor(ROI_W * 0.75);

      for (let x = midStart; x < midEnd; x++) {
        const diff = Math.abs(currentProfile[x] - prevScanline[x]);
        if (diff > centerDiffMax) centerDiffMax = diff;
      }

      const edgeDiffLeft = Math.abs(currentProfile[2] - prevScanline[2]);
      const edgeDiffRight = Math.abs(currentProfile[ROI_W - 3] - prevScanline[ROI_W - 3]);
      const isHandShake = (edgeDiffLeft > 25 && edgeDiffRight > 25);

      const threshold = parseFloat(sensitivitySlider.value);
      const now = performance.now();

      if (centerDiffMax > threshold && !isHandShake && (now - lastDropTime) > 180) {
        onDropDetected(now);
      }

      prevScanline = currentProfile;

      if (lastDropTime > 0 && (now - lastDropTime) > 4500) {
        resetMetrics();
      }
    }

    function onDropDetected(timestamp) {
      roiBox.classList.add('drop-pulse');
      setTimeout(() => roiBox.classList.remove('drop-pulse'), 80);

      if (lastDropTime > 0) {
        const deltaMs = timestamp - lastDropTime;
        if (deltaMs > 150) {
          intervals.push(deltaMs);
          if (intervals.length > MAX_HISTORY) intervals.shift();

          const avgIntervalMs = intervals.reduce((a, b) => a + b, 0) / intervals.length;
          const gttMin = Math.round(60000 / avgIntervalMs);
          const factor = parseFloat(dropFactorSelect.value);
          const mlHora = Math.round((gttMin * 60) / factor);

          bpmDisplay.innerText = gttMin;
          flowDisplay.innerText = mlHora;

          evaluateStatus(gttMin);
        }
      }

      lastDropTime = timestamp;
    }

    function evaluateStatus(currentGtt) {
      roiBox.classList.remove('status-target', 'status-low', 'status-high');
      bpmDisplay.classList.remove('text-target', 'text-low', 'text-high');
      flowDisplay.classList.remove('text-target', 'text-low', 'text-high');

      const tolerance = 2;

      if (Math.abs(currentGtt - targetGttMin) <= tolerance) {
        roiBox.classList.add('status-target');
        bpmDisplay.classList.add('text-target');
        flowDisplay.classList.add('text-target');
        statusBadge.innerText = "✓ Calibrado en Meta";
        statusBadge.style.borderColor = "#10b981";
        statusBadge.style.color = "#10b981";
      } else if (currentGtt < targetGttMin) {
        roiBox.classList.add('status-low');
        bpmDisplay.classList.add('text-low');
        flowDisplay.classList.add('text-low');
        statusBadge.innerText = "▲ Abrir carretilla (+)";
        statusBadge.style.borderColor = "#f59e0b";
        statusBadge.style.color = "#f59e0b";
      } else {
        roiBox.classList.add('status-high');
        bpmDisplay.classList.add('text-high');
        flowDisplay.classList.add('text-high');
        statusBadge.innerText = "▼ Cerrar carretilla (-)";
        statusBadge.style.borderColor = "#ef4444";
        statusBadge.style.color = "#ef4444";
      }
    }

    function resetMetrics() {
      intervals.length = 0;
      bpmDisplay.innerText = "0";
      flowDisplay.innerText = "0";
      bpmDisplay.className = "metric-value";
      flowDisplay.className = "metric-value";
      roiBox.className = "roi-box";
      statusBadge.innerText = "En pausa / Sin flujo";
      statusBadge.style.borderColor = "#374151";
      statusBadge.style.color = "#9ca3af";
    }

    inputVol.addEventListener('change', recalculateTargets);
inputTime.addEventListener('change', recalculateTargets);
    dropFactorSelect.addEventListener('change', recalculateTargets);

    recalculateTargets();
    window.addEventListener('DOMContentLoaded', startCamera);
    document.body.addEventListener('click', () => {
      if (video.paused) video.play();
    }, { once: true });
  </script>
</body>
</html>
